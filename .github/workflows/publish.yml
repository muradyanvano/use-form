name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish
        required: true
        type: string
      channel:
        description: npm dist-tag
        required: true
        type: choice
        options:
          - beta
          - latest

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install supported npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Release consistency checks
        run: npm run release:check

      - name: Run verification
        run: npm run verify:ci

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-publish

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install supported npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Release consistency checks
        run: npm run release:check

      - name: Build library
        run: npm run build:lib

      - name: Audit packed package
        run: npm run pack:dry-run

      - name: Validate publish inputs and package metadata
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
        run: |
          node <<'NODE'
          import { readFileSync } from 'node:fs'

          const semverCore = /^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z-.]+))?(?:\+([0-9A-Za-z-.]+))?$/

          const inputVersion = process.env.INPUT_VERSION?.trim()
          const inputChannel = process.env.INPUT_CHANNEL?.trim()
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))

          if (!inputVersion) throw new Error('workflow input version is required')
          if (!inputChannel) throw new Error('workflow input channel is required')
          if (pkg.name !== '@muradyanvano/use-form') {
            throw new Error(`Unexpected package name: ${pkg.name}`)
          }
          if (pkg.private) throw new Error('package.json still has private: true')
          if (pkg.version !== inputVersion) {
            throw new Error(`package.json version ${pkg.version} does not match workflow input ${inputVersion}`)
          }

          const match = semverCore.exec(inputVersion)
          if (!match) throw new Error(`Version ${inputVersion} is not valid SemVer`)

          const isPrerelease = Boolean(match[4])
          if (isPrerelease && inputChannel !== 'beta') {
            throw new Error(`Prerelease ${inputVersion} must use channel beta, not ${inputChannel}`)
          }
          if (!isPrerelease && inputChannel !== 'latest') {
            throw new Error(`Stable ${inputVersion} must use channel latest, not ${inputChannel}`)
          }

          console.log(`Validated ${pkg.name}@${pkg.version} for channel ${inputChannel}`)
          NODE

      - name: Confirm version is not already published
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if npm view "@muradyanvano/use-form@${INPUT_VERSION}" version > /dev/null 2>&1; then
            echo "Version ${INPUT_VERSION} is already published."
            exit 1
          fi

      - name: Publish to npm
        env:
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
        run: npm publish --access public --tag "$INPUT_CHANNEL"
