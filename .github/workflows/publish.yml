name: Publish npm beta

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install supported npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Run verification
        run: npm run verify:ci

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-publish

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install supported npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:lib

      - name: Confirm beta version
        shell: bash
        run: |
          node -e "
            const pkg = require('./package.json');

            if (pkg.private) {
              throw new Error('package.json still has private: true');
            }

            if (!pkg.version.includes('-beta.')) {
              throw new Error('Only beta versions can be published by this workflow');
            }

            console.log('Publishing', pkg.name, pkg.version);
          "

      - name: Confirm version is not already published
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")

          if npm view "@muradyanvano/use-form@$VERSION" version > /dev/null 2>&1; then
            echo "Version $VERSION is already published."
            exit 1
          fi

      - name: Publish beta
        run: npm publish --access public --tag beta